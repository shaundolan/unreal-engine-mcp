[project]
name = "unreal-engine-mcp"
version = "0.3.0"
description = "Local, open MCP server for driving a live Unreal Editor: Python execution, reflection, observation, Blueprint graphs and world building."
readme = "README_advanced.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mcp[cli]>=1.4.1",
  "fastmcp>=0.2.0",
  "uvicorn",
  "fastapi",
  "pydantic>=2.6.1",
  "requests"
]

[project.scripts]
unreal-mcp = "unreal_mcp_server_advanced:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "anthropic>=0.70",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["unreal_mcp_server_advanced"]

[tool.setuptools.packages.find]
include = ["unreal_mcp*", "helpers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Legacy modules (the original monolith and world-building helpers) are linted later.
extend-exclude = ["unreal_mcp_server_advanced.py", "helpers", "tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
# Editor-side scripts run inside Unreal with ARGS and _common helpers injected.
"unreal_mcp/editor_scripts/*.py" = ["F821", "E501", "B023"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
